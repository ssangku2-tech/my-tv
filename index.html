<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나만의 TV</title>
<meta name="description" content="한국 TV와 해외 영어 뉴스 채널을 한 화면에서 바로 보는 TV. 영어 방송은 실시간 2줄 자막">
<meta name="theme-color" content="#06070b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
/* VOICE: 조용하고 정확한 미래형 — 군더더기 없이, 화면이 주인공
   IDEA: 검은 유리 위에 보라·청록 오로라 빛이 천천히 흐름. 켜진 화면과 지금 채널만 빛으로 테두리
   COLOUR and TYPE: 바탕 #06070b, 유리 흰색 4%, 선 흰색 8%, 강조 보라 #8b6cff → 청록 #22d3ee 그라데이션; Pretendard
   LAYOUT: 머리줄 → 유리 패널(화면·채널 이름·조작부) → 출력·취침·끄기 → 영어 자막 → 분류 → 채널 타일 → 세계 채널 찾기 */
:root{color-scheme:dark;--bg:#06070b;--bg2:#0d0f17;--ink:#eef0f7;--mute:#8a90a6;--dim:#5d6377;
 --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.075);--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.16);
 --a1:#8b6cff;--a2:#22d3ee;--a3:#f472b6;--grad:linear-gradient(120deg,var(--a1),var(--a2));--mono:ui-monospace,"SF Mono","JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;letter-spacing:-.011em;overflow-x:clip;-webkit-font-smoothing:antialiased}
/* 오로라: 화면 뒤에서 천천히 흐르는 빛 */
body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.5}
body::before{width:60vmax;height:60vmax;left:-18vmax;top:-26vmax;background:radial-gradient(circle,rgba(139,108,255,.55),transparent 62%);animation:au1 22s ease-in-out infinite alternate}
body::after{width:55vmax;height:55vmax;right:-20vmax;top:10vmax;background:radial-gradient(circle,rgba(34,211,238,.38),transparent 62%);animation:au2 26s ease-in-out infinite alternate}
@keyframes au1{to{transform:translate(14vmax,10vmax) scale(1.15)}}@keyframes au2{to{transform:translate(-12vmax,16vmax) scale(.9)}}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.band{padding:clamp(16px,3vw,36px) max(4vw,16px)}
.wrap{max-width:920px;margin:0 auto}
/* 머리줄 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:920px;margin:0 auto 16px}
.top h1{display:flex;align-items:center;gap:10px;font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
.top h1 img{width:30px;height:30px;border-radius:9px}
.top h1 .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tr{display:flex;gap:12px;align-items:center}
.clock{font:500 13px var(--mono);color:var(--mute);letter-spacing:0}
.inst{background:var(--grad);color:#05060a;border:0;border-radius:99px;padding:8px 16px;min-height:38px;font-weight:700}
.inst[hidden]{display:none}
/* 유리 패널 */
.cab{max-width:920px;margin:0 auto;border-radius:28px;padding:clamp(12px,2vw,20px);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));
 border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -40px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
/* 화면 */
.scr{position:relative;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#000;container-type:inline-size;
 box-shadow:0 0 0 1px var(--line2);transition:box-shadow .6s}
.playing .scr{box-shadow:0 0 0 1px rgba(139,108,255,.55),0 24px 90px -30px rgba(139,108,255,.7),0 12px 70px -40px rgba(34,211,238,.8)}
.scr video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.scr:fullscreen{border-radius:0;box-shadow:none;aspect-ratio:auto;width:100vw;height:100vh}
.off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:clamp(13px,2.4cqw,20px);padding:20px;
 background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(139,108,255,.14),transparent 70%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/6cqw 6cqw,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/6cqw 6cqw,#05060a}
.off[hidden]{display:none}
/* 연결 중: 빛 고리가 돎 */
.scr.loading::before{content:"";position:absolute;z-index:2;left:50%;top:50%;width:11cqw;height:11cqw;margin:-5.5cqw 0 0 -5.5cqw;border-radius:50%;
 background:conic-gradient(from 0deg,transparent 0 25%,var(--a1) 60%,var(--a2));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:spin .9s linear infinite}
.scr.loading::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 50%,rgba(139,108,255,.18),rgba(0,0,0,.55) 60%)}
@keyframes spin{to{transform:rotate(1turn)}}
.osd{position:absolute;z-index:3;left:3cqw;top:3cqw;display:flex;align-items:center;gap:.6em;font-size:clamp(12px,2.2cqw,22px);font-weight:600;color:#fff;
 padding:.45em .9em .45em .5em;border-radius:99px;background:rgba(8,9,16,.55);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;pointer-events:none}
.osd i{font:700 .8em var(--mono);font-style:normal;padding:.2em .55em;border-radius:99px;background:var(--grad);color:#05060a}
.osd.show{opacity:1;transform:none}
.busy{position:absolute;z-index:3;right:3cqw;top:3cqw;font-size:clamp(11px,1.8cqw,15px);background:rgba(8,9,16,.6);border:1px solid rgba(255,255,255,.12);color:var(--ink);border-radius:99px;padding:3px 12px;pointer-events:none}
.busy[hidden]{display:none}
/* 자막: 화면 아래 2줄 */
.sub{position:absolute;z-index:3;left:7cqw;right:7cqw;bottom:4.5cqw;text-align:center;pointer-events:none;font-size:clamp(13px,2.8cqw,36px);line-height:1.4;
 color:#fff;font-weight:650;letter-spacing:-.005em;text-shadow:0 0 1px #000,0 0 2px #000,0 1px 3px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.55)}
.sub[hidden]{display:none}
/* 글자 뒤 화면 아래쪽만 살짝 어둡게 (상자 대신) */
.sub::before{content:"";position:absolute;z-index:-1;left:-7cqw;right:-7cqw;bottom:-4.5cqw;height:26cqw;background:linear-gradient(transparent,rgba(0,0,0,.28) 45%,rgba(0,0,0,.5));transition:opacity .8s}
.subx{height:2.8em;overflow:hidden;transition:opacity .8s;-webkit-mask:linear-gradient(transparent,#000 .35em);mask:linear-gradient(transparent,#000 .35em)}
.sub .nw{animation:wIn .45s ease-out both}
@keyframes wIn{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:none}}
.sub.hush .subx,.sub.hush .subko,.sub.hush::before{opacity:0}
.sub .wait{text-shadow:none;font-weight:500;display:inline-flex;align-items:center;gap:.5em;background:rgba(6,7,12,.66);color:#c9cde0;font-size:.62em;padding:.3em .9em;border-radius:99px;border:1px solid rgba(255,255,255,.12)}
.sub .wait::before{content:"AI";font:800 .8em var(--mono);padding:.1em .45em;border-radius:99px;background:var(--grad);color:#05060a}
.subko{display:none;margin-top:.1em;height:1.4em;overflow:hidden;color:#9becff;transition:opacity .8s}
.sub.ko .subx{height:1.4em;-webkit-mask:none;mask:none}.sub.ko .subko{display:block}
/* 채널 이름 */
.now{display:flex;gap:12px;align-items:center;margin:18px 4px 0}
.now-l{flex:1}
.now-name{display:flex;align-items:center;gap:12px;font-size:clamp(22px,3.6vw,34px);line-height:1.15;font-weight:700;letter-spacing:-.03em}
.now-name em{font:600 .5em var(--mono);font-style:normal;letter-spacing:0;padding:.3em .7em;border-radius:99px;border:1px solid var(--line2);color:var(--mute)}
.playing .now-name em{border-color:transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;color:var(--ink)}
.now-desc{color:var(--mute);font-size:14.5px;min-height:1.5em;margin-top:6px}
.lamp{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);white-space:nowrap;margin-top:8px}
.lamp[hidden]{display:none}
.lamp::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--dim)}
.playing .lamp::before{background:var(--a2);box-shadow:0 0 0 4px rgba(34,211,238,.18);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(34,211,238,0)}}
/* 조작부 */
.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:14px 4px 2px;margin-top:16px}
.transport{display:flex;align-items:center;gap:10px}
.rb{width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;color:var(--ink);background:var(--glass);transition:background .2s,border-color .2s,transform .1s}
.rb:hover{background:var(--glass2);border-color:rgba(255,255,255,.26)}
.rb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rb.big{width:58px;height:58px;border:0;color:#05060a;background:var(--grad);box-shadow:0 10px 30px -10px rgba(139,108,255,.8)}
.rb.big svg{width:24px;height:24px;fill:currentColor;stroke:none}
.rb:active{transform:scale(.94)}
.vol{display:flex;align-items:center;gap:6px}
/* 볼륨: 빛 고리 다이얼 */
.kwrap{--v:.7;position:relative;width:72px;height:72px;display:grid;place-items:center}
.kwrap::before{content:"";position:absolute;inset:0;border-radius:50%;
 background:conic-gradient(from 225deg,var(--a1) 0deg,var(--a2) calc(var(--v)*270deg),rgba(255,255,255,.1) calc(var(--v)*270deg) 270deg,transparent 270deg);
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
.kwrap svg{display:none}
.knob{--a:0deg;width:54px;height:54px;border-radius:50%;touch-action:none;cursor:grab;position:relative;background:radial-gradient(circle at 35% 30%,#2a2e3e,#12141d 70%);
 border:1px solid var(--line2);box-shadow:0 8px 20px -8px rgba(0,0,0,.8);transform:rotate(var(--a))}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a2);box-shadow:0 0 8px var(--a2)}
.knob:active{cursor:grabbing}
.vstep{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:none;color:var(--mute);display:grid;place-items:center}
.vstep:hover{color:var(--ink);border-color:var(--line2)}
.vstep svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.kcap{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;display:grid;place-items:center;
 font:600 13px var(--mono);color:var(--ink);letter-spacing:-.02em}
.kcap.muted{color:var(--a3);font:700 10px "Pretendard Variable",system-ui}
/* 도구줄 */
.tools{max-width:920px;margin:12px auto 0;display:flex;gap:10px;align-items:stretch}
.segs{flex:1;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.segl{flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 10px;font-size:12.5px;font-weight:600;color:var(--mute)}
.segl::before{content:"AI";font:800 10px var(--mono);padding:2px 6px;border-radius:99px;background:var(--grad);color:#05060a}
.seg{flex:1;position:relative;border:0;background:none;min-height:40px;border-radius:12px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px;transition:background .2s,color .2s}
.seg:hover{color:var(--ink)}
.seg svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}
.seg[aria-pressed=true]{color:#fff;background:linear-gradient(120deg,rgba(139,108,255,.35),rgba(34,211,238,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.on-badge{display:none;position:absolute;top:-9px;right:8px;z-index:1;font:800 9px/14px var(--mono);font-style:normal;letter-spacing:.06em;padding:1px 7px;border-radius:99px;background:var(--grad);color:#05060a;box-shadow:0 0 14px rgba(34,211,238,.7)}
.seg.live .on-badge{display:inline-block}
.tools.capr{margin-top:8px}
.slp,.pwr{position:relative;flex:none;display:flex;align-items:center;gap:7px;padding:0 16px;border:1px solid var(--line);border-radius:16px;min-height:50px;font-weight:600;color:var(--mute);white-space:nowrap;background:var(--glass)}
.slp:hover,.pwr:hover{color:var(--ink);border-color:var(--line2)}
.slp svg,.pwr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.slp.on{color:var(--ink);border-color:transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box}
.slp select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.slp:focus-within{outline:2px solid var(--a2);outline-offset:3px}
.pwr.live{color:#fff;border-color:transparent;background:linear-gradient(120deg,#f43f5e,#f472b6);box-shadow:0 8px 24px -10px rgba(244,63,94,.8)}
.pwr.live:active{transform:scale(.97)}
/* 분류 */
.chips{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:0 16px;min-height:38px;font-size:14.5px;font-weight:500;color:var(--mute);white-space:nowrap;transition:color .2s,border-color .2s}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip[aria-pressed=true]{color:var(--ink);border-color:transparent;background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;font-weight:600}
/* 채널 타일 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;padding-bottom:6px}
.st{position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:18px;padding:13px 15px 13px;min-height:86px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;
 background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));border:1px solid var(--line);transition:transform .18s,border-color .2s,background .2s}
.st:hover{transform:translateY(-2px);border-color:var(--line2);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03))}
.st:active{transform:scale(.98)}
.st .no{position:absolute;left:15px;top:11px;font:600 11.5px var(--mono);color:var(--dim);letter-spacing:.02em}
.st .cc{position:absolute;right:11px;top:10px;font:700 10px/16px "Pretendard Variable",system-ui;font-style:normal;padding:0 7px;border-radius:99px;color:#cfd7ff;
 background:linear-gradient(var(--bg2),var(--bg2)) padding-box,var(--grad) border-box;border:1px solid transparent;letter-spacing:0}
.st b{display:block;width:100%;font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:18px}
.st .d{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.cur{border-color:transparent;background:linear-gradient(160deg,rgba(139,108,255,.26),rgba(34,211,238,.1)) padding-box,linear-gradient(#0c0d16,#0c0d16) padding-box,var(--grad) border-box;box-shadow:0 14px 40px -18px rgba(139,108,255,.8)}
.st.cur .no{color:var(--ink)}
.st.cur .no::after{content:" ● LIVE";color:var(--a2);font-weight:700}
.empty{color:var(--mute);padding:20px 0}
/* 세계 채널 찾기 */
h2{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 14px;max-width:70ch;font-size:14.5px}
.box{border-radius:24px;padding:22px;background:var(--glass);border:1px solid var(--line)}
.field{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.field input{flex:1 1 180px;border:1px solid var(--line2);border-radius:14px;padding:10px 14px;min-height:46px;background:rgba(0,0,0,.35);font-size:16px}
.field input:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(139,108,255,.25)}
.btn{border:0;border-radius:14px;padding:10px 22px;min-height:46px;background:var(--grad);color:#05060a;font-weight:700}
.res{list-style:none;padding:0;margin:0;max-height:360px;overflow:auto}
.res li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.res li div{flex:1}
.res small{color:var(--mute);display:block;font-size:12.5px}
.res button{min-height:38px;padding:6px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--glass)}
.res button:hover{border-color:var(--a1)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,8px);background:rgba(16,18,28,.82);border:1px solid var(--line2);color:var(--ink);padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:90vw;z-index:9;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{color:var(--dim);font-size:12.5px}
/* 전체 화면: 화면 위 버튼(채널 ⌃⌄·닫기)은 한 번 톡 치면 3초 동안 */
.fsbar{display:none;position:absolute;z-index:5;top:max(3cqw,env(safe-area-inset-top));right:max(3cqw,env(safe-area-inset-right));gap:10px;opacity:0;pointer-events:none;transition:opacity .3s}
.scr:fullscreen .fsbar,body.fs .fsbar{display:flex}
.scr.ctl .fsbar{opacity:1;pointer-events:auto}
.fsbar button{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(8,9,16,.55);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.fsbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scr:fullscreen .osd,body.fs .osd{top:max(3cqw,env(safe-area-inset-top));left:max(3cqw,env(safe-area-inset-left))}
body.fs{overflow:hidden}body.fs .cab{-webkit-backdrop-filter:none;backdrop-filter:none}
body.fs .scr{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;box-shadow:none}
/* PC TV 화면 모드: 화면만 창 가득 */
body.screenmode{background:#000;overflow:hidden}body.screenmode::before,body.screenmode::after{display:none}
.screenmode .band:not(#player),.screenmode footer,.screenmode .top,.screenmode .now,.screenmode .panel,.screenmode .tools{display:none}
.screenmode #player{padding:0}.screenmode .cab{padding:0;border:0;border-radius:0;background:#000;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.screenmode .scr{position:fixed;inset:0;aspect-ratio:auto;border-radius:0;box-shadow:none}
.screenmode .off{font-size:clamp(16px,2vw,28px);line-height:1.7}.screenmode .off b{display:block;font:300 4.4em/1.1 "Pretendard Variable",system-ui;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.2em}
.screenmode.idle{cursor:none}
@media(prefers-reduced-motion:reduce){body::before,body::after,.playing .lamp::before{animation:none}}
@media(max-width:600px){
 .cab{border-radius:24px}.scr{border-radius:16px}.now{margin-top:14px}.panel{gap:6px;padding-top:12px}.transport{gap:6px}
 .rb{width:40px;height:40px}.rb.big{width:52px;height:52px}.rb svg{width:18px;height:18px}
 .kwrap{width:62px;height:62px}.knob{width:46px;height:46px}.vstep{width:34px;height:34px}.vstep svg{width:16px;height:16px}.vol{gap:2px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.st{min-height:80px;padding:11px 12px}.st .no{left:12px}.st b{font-size:16px}
 .top h1{font-size:17px}.clock{display:none}.inst{min-height:34px;padding:6px 14px;font-size:13.5px}
 .tools{gap:6px}.seg svg{display:none}.slp,.pwr{padding:0 12px;gap:4px;min-height:48px}.segl{padding:0 4px 0 6px}.segl span{display:none}}
@media(max-width:380px){.slp span,.pwr span{display:none}.rb:not(.big){width:34px;height:34px}.vstep{width:32px;height:32px}.transport{gap:5px}}
</style>
</head>

const resolve=async s=>{
 if(s.kbs){const r=await fetch(`https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/${s.kbs}`);const j=await r.json();const it=(j.channel_item||[]).find(x=>/m3u8/.test(x.service_url||''))||j.channel_item[0];return it.service_url}
 return s.u};

// 화면: 꺼짐 / 지지직(연결 중) / 방송
const noiseOn=on=>$('#scr').classList.toggle('loading',!!on);   // 연결 중: 화면 가운데 빛 고리
const chOsd=s=>`<i>${String(chNo(s)).padStart(2,'0')}</i>${esc(s.n)}`;
let osdT;const osd=(t,ms=3500)=>{const o=$('#osd');o.innerHTML=t;o.classList.add('show');clearTimeout(osdT);if(ms)osdT=setTimeout(()=>o.classList.remove('show'),ms)};
const busy=t=>{$('#busy').textContent=t||'';$('#busy').hidden=!t};
const setState=t=>{const el=$('#state');el.textContent=t;el.hidden=!t||t==='ON AIR'};

const killHls=()=>{if(hls){hls.destroy();hls=null}capDetach()};
const play=async(s,isRetry)=>{
 if(!s)return;cur=s;want=true;pwrUi();if(!isRetry){retry=0;s._native=0}
 $('#nowName').innerHTML=`<em>${chNo(s)}</em>${esc(s.n)}`;$('#nowDesc').textContent=s.d||'';
 $('#off').hidden=true;noiseOn(true);osd(chOsd(s),0);busy('');
 setState('연결 중…');save('last',s.id);render();mediaMeta();
 if(out==='pc'){killHls();tv.pause();noiseOn(false);pcCast(s);return}
 let url;
 try{url=await resolve(s)}catch(err){if(cur!==s)return;
  setState('연결 실패');toast('방송 주소를 받아오지 못했어요');want=false;setPlaying(false);return}
 if(cur!==s)return;
 killHls();tv.pause();capReset();
 if(/\.m3u8|media-manifest/i.test(url)&&window.Hls&&Hls.isSupported()&&!s._native){
  hls=new Hls({lowLatencyMode:false,backBufferLength:30});
  if(s.cap)capAttach(hls);
  hls.loadSource(url);hls.attachMedia(tv);
  hls.on(Hls.Events.ERROR,(_,d)=>{if(!d.fatal)return;
   if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!s._rec){s._rec=1;hls.recoverMediaError();return}
   if(tv.canPlayType('application/vnd.apple.mpegurl')&&!s._native){s._native=1;killHls();tv.src=url;tv.play().catch(blocked);return}
   fail()});
  hls.on(Hls.Events.MANIFEST_PARSED,()=>tv.play().catch(blocked));
 }else{tv.src=url;tv.play().catch(blocked)}
 capUi()};
const blocked=e=>{if(e&&e.name==='NotAllowedError'){setState('▶ 눌러서 켜기');want=false;noiseOn(false)}};
const fail=()=>{if(!want)return;if(retry<3){retry++;setState(`다시 연결 중 (${retry}/3)`);setTimeout(()=>want&&play(cur,true),1500*retry)}
 else{setState('연결 실패');scrPub('fail');want=false;setPlaying(false);noiseOn(false);$('#off').hidden=false;$('#off').textContent='이 채널은 지금 안 나와요';toast('이 채널은 지금 안 나와요. 다른 채널을 골라 보세요.')}};
const stop=()=>{if(document.body.classList.contains('fs'))pseudoFs(false);const wasPc=out==='pc'&&!!pcCode&&(want||playing);want=false;killHls();tv.pause();tv.removeAttribute('src');tv.load();setPlaying(false);setState('');noiseOn(false);busy('');
 $('#off').hidden=false;$('#off').textContent='꺼짐 · 채널을 누르면 켜져요';$('#osd').classList.remove('show');
 if(screenMode){scrIdle();scrPub('stop')}
 if(wasPc){setState('PC 끄는 중…');pcSend({a:'stop'})}};
const pwrUi=()=>$('#pwrOff').classList.toggle('live',!!(playing||want));
const setPlaying=v=>{playing=v;$('#player').classList.toggle('playing',v);pwrUi();$('#outPhone').classList.toggle('live',v&&out!=='pc');
 $('#playIco').innerHTML=v?'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
 if('mediaSession' in navigator)navigator.mediaSession.playbackState=v?'playing':'paused';wakeUi(v&&out!=='pc');capUi()};
tv.addEventListener('playing',()=>{retry=0;if(cur)cur._rec=0;setPlaying(true);scrPub('play');setState('ON AIR');noiseOn(false);busy('');osd(chOsd(cur))});
tv.addEventListener('waiting',()=>want&&busy('버퍼링…'));
tv.addEventListener('error',()=>{if(!hls)fail()});
let stallT;tv.addEventListener('stalled',()=>{clearTimeout(stallT);stallT=setTimeout(()=>{if(want&&!tv.paused&&tv.readyState<3)fail()},15000)});

$('#play').onclick=()=>{if(playing||want)stop();else play(cur||byId(load('last','kbs1'))||ST[0])};
const step=d=>{const l=listNow().length?listNow():all();if(!l.length)return;let i=cur?l.indexOf(cur):-1;
 i=i<0?(d>0?0:l.length-1):(i+d+l.length)%l.length;play(l[i])};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);

// 전체 화면: 화면 상자째로 (자막도 같이 크게). 안드로이드·PC는 진짜 전체 화면 + 가로 고정,
// 아이폰(화면 상자 전체 화면이 안 됨)은 앱 화면을 가득 채우는 방식 → 아이폰 동영상 화면과 달리 자막이 남음
const realFs=()=>document.fullscreenElement||document.webkitFullscreenElement;
const isFs=()=>!!realFs()||document.body.classList.contains('fs');
let autoFs=false,ctlT;
const showCtl=()=>{const el=$('#scr');el.classList.add('ctl');clearTimeout(ctlT);ctlT=setTimeout(()=>el.classList.remove('ctl'),3000)};
const pseudoFs=on=>{document.body.classList.toggle('fs',on);if(on)showCtl();else autoFs=false};
const exitFs=()=>{if(realFs()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);try{screen.orientation.unlock()}catch(e){}}pseudoFs(false)};
const fullscreen=()=>{const el=$('#scr');if(isFs()){exitFs();return}
 if(el.requestFullscreen)el.requestFullscreen({navigationUI:'hide'}).then(()=>{showCtl();try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>pseudoFs(true));
 else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();showCtl()}else pseudoFs(true)};
$('#full').onclick=fullscreen;$('#scr').addEventListener('dblclick',e=>{if(!e.target.closest('.fsbar'))fullscreen()});
// 전체 화면에서 화면을 톡: 채널 ⌃⌄·닫기 버튼이 3초 동안 보임
$('#scr').addEventListener('click',e=>{if(isFs()&&!e.target.closest('.fsbar'))showCtl()});
$('#fsPrev').onclick=()=>{step(-1);showCtl()};$('#fsNext').onclick=()=>{step(1);showCtl()};$('#fsExit').onclick=exitFs;
// 폰을 가로로 돌리면 (보는 중일 때) 자동으로 화면 가득, 다시 세로로 돌리면 원래대로

let wasLand=land.matches;
const onTurn=()=>{if(screenMode||land.matches===wasLand)return;wasLand=land.matches;
 if(land.matches&&(playing||want)&&out!=='pc'&&!isFs()){autoFs=true;pseudoFs(true)}
 else if(!land.matches&&autoFs&&!realFs())pseudoFs(false)};
// 폰마다 알려 주는 방식이 달라 세 가지 다 들음 (한 번만 처리됨)
land.addEventListener('change',onTurn);addEventListener('orientationchange',()=>setTimeout(onTurn,250));addEventListener('resize',onTurn);

// 볼륨: 빛 고리 다이얼 (돌리기·휠·−/+·↑↓), 가운데 누르면 음소거
const knob=$('#knob');let vol=70,muted=false;
const volIco=()=>{$('#volOut').textContent=muted?'무음':vol;$('#volOut').classList.toggle('muted',muted);
 knob.style.setProperty('--a',`${-135+270*vol/100}deg`);knob.parentNode.style.setProperty('--v',vol/100);knob.setAttribute('aria-valuenow',vol);knob.setAttribute('aria-valuetext',muted?'무음':`${vol}%`)};
let volT;
const setVol=(v,quiet)=>{vol=Math.round(Math.max(0,Math.min(100,v)));tv.volume=(vol/100)**2;if(!screenMode)save('vol',vol);if(vol>0&&muted){muted=false;tv.muted=false}volIco();
 if(out==='pc'&&pcCode&&!quiet){clearTimeout(volT);volT=setTimeout(()=>pcSend({a:'vol',v:vol}),400)}};
let drag=null;
const kAng=e=>{const r=knob.getBoundingClientRect();return Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2)*180/Math.PI};
knob.addEventListener('pointerdown',e=>{e.preventDefault();knob.setPointerCapture(e.pointerId);drag={a:kAng(e),v:vol,moved:0,x:e.clientX,y:e.clientY};knob.focus()});
knob.addEventListener('pointermove',e=>{if(!drag)return;const a=kAng(e);let d=a-drag.a;if(d>180)d-=360;if(d<-180)d+=360;drag.a=a;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=1;if(!drag.moved)return;
 drag.v=Math.max(0,Math.min(100,drag.v+Math.max(-40,Math.min(40,d))*100/270));setVol(drag.v)});
knob.addEventListener('pointerup',()=>{if(drag&&!drag.moved)toggleMute();drag=null});knob.addEventListener('pointercancel',()=>{drag=null});
knob.addEventListener('wheel',e=>{e.preventDefault();setVol(vol+(e.deltaY<0?5:-5))},{passive:false});
knob.addEventListener('keydown',e=>{const s={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5,PageUp:10,PageDown:-10}[e.key];
 if(s){e.preventDefault();e.stopPropagation();setVol(vol+s)}});
$('#volDown').onclick=()=>setVol(vol-5);$('#volUp').onclick=()=>setVol(vol+5);
const toggleMute=()=>{muted=!muted;tv.muted=muted;volIco();if(out==='pc'&&pcCode)pcSend({a:'vol',v:muted?0:vol})};
setVol(load('vol',70));

// 단축키: Space 켜기/끄기, ←→ 채널, ↑↓ 볼륨, 숫자 채널 번호, Enter 전체 화면, M 음소거, C 자막
let numBuf='',numT;
document.addEventListener('keydown',e=>{
 if(e.target.matches('input,select,textarea')){if(e.key==='Escape')e.target.blur();return}
 if(e.key==='Escape'&&document.body.classList.contains('fs')){pseudoFs(false);return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k===' '){e.preventDefault();$('#play').click()}
 else if(k==='ArrowRight'||k==='PageUp')step(1);else if(k==='ArrowLeft'||k==='PageDown')step(-1);
 else if(k==='ArrowUp'){e.preventDefault();setVol(vol+5)}else if(k==='ArrowDown'){e.preventDefault();setVol(vol-5)}
 else if(k==='Enter'&&!(e.target.classList&&e.target.classList.contains('st'))&&e.target.tagName!=='BUTTON')fullscreen();
 else if(k==='m'||k==='M'||k==='ㅡ')toggleMute();
 else if(k==='c'||k==='C'||k==='ㅊ')setCap({off:'en',en:'ko',ko:'off'}[capMode]);
 else if(/^[0-9]$/.test(k)){numBuf+=k;osd(`<i>${numBuf.padStart(2,'-')}</i>채널 번호`,0);clearTimeout(numT);
  numT=setTimeout(()=>{const s=all()[+numBuf-1];numBuf='';if(s)play(s);else{osd('<i>--</i>없는 채널',1500)}},numBuf.length>=2?100:1300)}
});

 navigator.mediaSession.metadata=new MediaMetadata({title:cur.n,artist:cur.d||'',album:'나만의 TV'})};
if('mediaSession' in navigator){const m=navigator.mediaSession;
 m.setActionHandler('play',()=>play(cur||ST[0]));m.setActionHandler('pause',stop);m.setActionHandler('stop',stop);
 m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1))}

// 보는 동안 화면 꺼짐 막기

const wakeUi=on=>{if(on){if(wake||wakeAsk||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;wakeAsk=true;
  navigator.wakeLock.request('screen').then(w=>{wakeAsk=false;wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null});if(!playing){w.release().catch(()=>{});wake=null}}).catch(()=>{wakeAsk=false})}
 else if(wake){const w=wake;wake=null;w.release().catch(()=>{})}};

// 끄기 버튼 + 취침 타이머 (마지막 30초 동안 소리가 서서히 작아짐)
let sleepAt=0,baseVol=null;
$('#pwrOff').onclick=()=>{if(out==='pc'&&pcCode){sleepAt=0;$('#sleep').value='0';want=true;stop();toast('PC 화면 TV를 껐어요');return}
 if(!(playing||want)){toast('TV가 꺼져 있어요');return}sleepAt=0;$('#sleep').value='0';stop();toast('TV를 껐어요')};
$('#sleep').onchange=e=>{const m=+e.target.value;sleepAt=m?Date.now()+m*60000:0;toast(m?`${m}분 뒤에 꺼집니다`:'취침 타이머를 껐어요');tick()};
const sleepUi=left=>{$('#slp').classList.toggle('on',left>0);$('#sleepLbl').textContent=left>0?`${Math.floor(left/60)}:${String(Math.floor(left%60)).padStart(2,'0')}`:'취침'};
const tick=()=>{const d=new Date();
 $('#clock').textContent=d.toLocaleString('ko-KR',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
 if(sleepAt){const left=(sleepAt-Date.now())/1000;
